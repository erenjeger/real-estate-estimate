<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Real Estate Estimate{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232456c8'%3E%3Cpath d='M12 3 3 10v1h2v1 0 7h5v-5h4v5h5v-7h2v-1z'/%3E%3C/svg%3E">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (error) { /* private mode */ }
      var themeMatch = window.matchMedia("(prefers-color-scheme: dark)");
      var resolved = (stored === "dark" || stored === "light") ? stored : (themeMatch.matches ? "dark" : "light");
      document.documentElement.setAttribute("data-bs-theme", resolved);
      themeMatch.addEventListener("change", function (event) {
        var override = null;
        try { override = localStorage.getItem("theme"); } catch (error) { /* private mode */ }
        if (override !== "dark" && override !== "light") {
          document.documentElement.setAttribute("data-bs-theme", event.matches ? "dark" : "light");
        }
      });
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=asset_version('css/style.css')) }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{{ url_for('main.dashboard') }}">Real Estate Estimate</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <div class="navbar-nav ms-auto">
        <a class="nav-link {{ 'active' if request.endpoint == 'main.dashboard' }}" href="{{ url_for('main.dashboard') }}">Dashboard</a>
        <a class="nav-link {{ 'active' if request.endpoint in ['main.predict', 'main.result'] }}" href="{{ url_for('main.predict') }}">Prediksi</a>
        <a class="nav-link {{ 'active' if request.endpoint == 'main.history' }}" href="{{ url_for('main.history') }}">Riwayat</a>
      </div>
      <div class="ms-auto">
        <button class="btn theme-toggle btn-sm ms-lg-2 mt-2 mt-lg-0" type="button" id="themeToggle" aria-label="Ganti tema terang atau gelap" title="Ganti tema">
          <i class="bi bi-moon-stars icon-moon" aria-hidden="true"></i><i class="bi bi-sun icon-sun" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</nav>
<main class="container py-4 py-lg-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="container pb-4 mt-auto">
  <div class="small text-secondary pt-3 border-top">
    Estimasi harga bersifat informatif dan bukan penilaian resmi properti.
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById("themeToggle").addEventListener("click", function () {
    var isDark = document.documentElement.getAttribute("data-bs-theme") === "dark";
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-bs-theme", next);
    try { localStorage.setItem("theme", next); } catch (error) { /* private mode */ }
  });
</script>
</body>
</html>
