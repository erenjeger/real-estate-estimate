services:
  db:
    image: postgres:16-alpine
    container_name: real-estate-estimate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: homeprice
      POSTGRES_USER: homeprice
      POSTGRES_PASSWORD: homeprice_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeprice -d homeprice"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: real-estate-estimate-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
